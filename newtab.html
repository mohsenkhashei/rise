<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise - New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Wallpaper Container -->
  <div class="wallpaper-container" id="wallpaper"></div>
  <div class="wallpaper-overlay"></div>

  <!-- Main Content Layout -->
  <div class="container">
    <!-- Fliqlo-style Center Clock -->
    <div class="clock-container">
      <!-- Hours Flip Card -->
      <div class="flip-card" id="hours-card">
        <div class="card-half card-top">00</div>
        <div class="card-half card-bottom">00</div>
        <div class="card-half card-top-flip">00</div>
        <div class="card-half card-bottom-flip">00</div>
      </div>
      
      <!-- Colon Separator -->
      <div class="clock-separator">:</div>
      
      <!-- Minutes Flip Card -->
      <div class="flip-card" id="minutes-card">
        <div class="card-half card-top">00</div>
        <div class="card-half card-bottom">00</div>
        <div class="card-half card-top-flip">00</div>
        <div class="card-half card-bottom-flip">00</div>
      </div>
    </div>

    <!-- Quote Box (Glassmorphic Card) -->
    <div class="quote-container" id="quote-box">
      <p class="quote-text" id="quote-text">Loading daily inspiration...</p>
      <p class="quote-author" id="quote-author"></p>
    </div>
  </div>

  <!-- Bottom Left: Wallpaper attribution -->
  <div class="attribution-container" id="attribution">
    <span class="attribution-icon">📍</span>
    <span class="attribution-text" id="wallpaper-credit">Loading location...</span>
  </div>

  <!-- Bottom Right: Interactive Controls -->
  <div class="controls-container">
    <button class="control-btn" id="refresh-btn" title="Refresh Wallpaper and Quote">
      <svg class="refresh-icon" viewBox="0 0 24 24" width="20" height="20">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
