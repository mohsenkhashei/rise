<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rise - New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Wallpaper Container -->
  <div class="wallpaper-container" id="wallpaper"></div>
  <div class="wallpaper-overlay"></div>

  <!-- Main Content Layout -->
  <div class="container">
    <!-- Fliqlo-style Center Clock -->
    <div class="clock-container">
      <!-- Hours Flip Card -->
      <div class="flip-card" id="hours-card">
        <div class="card-half card-top"><span>00</span></div>
        <div class="card-half card-bottom"><span>00</span></div>
        <div class="card-half card-top-flip"><span>00</span></div>
        <div class="card-half card-bottom-flip"><span>00</span></div>
      </div>
      
      <!-- Colon Separator -->
      <div class="clock-separator">:</div>
      
      <!-- Minutes Flip Card -->
      <div class="flip-card" id="minutes-card">
        <div class="card-half card-top"><span>00</span></div>
        <div class="card-half card-bottom"><span>00</span></div>
        <div class="card-half card-top-flip"><span>00</span></div>
        <div class="card-half card-bottom-flip"><span>00</span></div>
      </div>
    </div>

    <!-- Quote Box (Glassmorphic Card) -->
    <div class="quote-container" id="quote-box">
      <p class="quote-text" id="quote-text">Loading daily inspiration...</p>
      <p class="quote-author" id="quote-author"></p>
    </div>
  </div>

  <!-- Bottom Left: Wallpaper attribution -->
  <div class="attribution-container" id="attribution">
    <span class="attribution-icon">📍</span>
    <span class="attribution-text" id="wallpaper-credit">Loading location...</span>
  </div>

  <!-- Bottom Right: Interactive Controls (Gear + Refresh) -->
  <div class="controls-container">
    <button class="control-btn" id="settings-btn" title="Preferences" aria-label="Toggle settings panel" aria-expanded="false" aria-controls="settings-panel">
      <svg class="settings-icon" viewBox="0 0 24 24" width="20" height="20">
        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
      </svg>
    </button>
    <button class="control-btn" id="refresh-btn" title="Refresh Wallpaper and Quote" aria-label="Refresh wallpaper and quote">
      <svg class="refresh-icon" viewBox="0 0 24 24" width="20" height="20">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </div>

  <!-- Glassmorphic Settings Panel -->
  <div class="settings-panel" id="settings-panel" role="dialog" aria-label="Preferences" aria-hidden="true">
    <div class="settings-header">Preferences</div>
    <div class="settings-list">
      <div class="settings-item">
        <span class="settings-label" id="lbl-clock">Show Clock</span>
        <button role="switch" aria-checked="true" aria-labelledby="lbl-clock" class="switch" id="toggle-clock">
          <span class="switch-thumb"></span>
        </button>
      </div>
      <div class="settings-item">
        <span class="settings-label" id="lbl-quote">Show Quote</span>
        <button role="switch" aria-checked="true" aria-labelledby="lbl-quote" class="switch" id="toggle-quote">
          <span class="switch-thumb"></span>
        </button>
      </div>
      <div class="settings-item">
        <span class="settings-label" id="lbl-wallpaper">Show Wallpaper</span>
        <button role="switch" aria-checked="true" aria-labelledby="lbl-wallpaper" class="switch" id="toggle-wallpaper">
          <span class="switch-thumb"></span>
        </button>
      </div>
      <div class="settings-item">
        <span class="settings-label" id="lbl-24h">24-Hour Format</span>
        <button role="switch" aria-checked="true" aria-labelledby="lbl-24h" class="switch" id="toggle-24h">
          <span class="switch-thumb"></span>
        </button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
